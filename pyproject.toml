[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scripty"
version = "0.2.0"
description = "A human-in-the-loop fiction trainer: pairwise drafts, human as only judge"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "typer>=0.12",
    "anthropic>=0.40",
    "pydantic>=2.7",
    "rapidfuzz>=3.6",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
scripty = "scripty.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: builds a real film with ffmpeg (runs by default, < 20s)",
]
